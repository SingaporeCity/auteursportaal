name: Deploy to GitHub Pages

# Auto-deploy bij push naar main + handmatige trigger als fallback.
# Geactiveerd in iter 9 nadat Pages + secrets in repo-settings zijn ingesteld.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk; queue mag wachten zonder concurrent runs
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build + Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint + Typecheck (gating)
        run: |
          npm run lint
          npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_ADMIN_SSO_ENABLED: 'false'
          # Test-fase: 2FA uitgeschakeld. Verwijder/zet op '' om enforcement
          # weer aan te zetten — niemand zit dan vast, enroll-flow vangt het op.
          VITE_DISABLE_MFA: 'true'
          # Test-fase: wachtwoord-minimum tijdelijk omlaag zodat testers
          # niet hoeven uit te wijken naar een wachtwoordmanager. Verwijder
          # (of zet op '12') zodra de OWASP-baseline weer terug moet.
          VITE_PASSWORD_MIN_LENGTH: '6'

      - name: Verify no service_role JWT or env-var name in bundle
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const files = [];
            (function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(p);
                else if (/\.(js|css|html)$/.test(entry.name)) files.push(p);
              }
            })('dist');

            const jwtRegex = /eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}/g;
            let leaks = 0;
            for (const file of files) {
              const content = fs.readFileSync(file, 'utf8');
              if (content.includes('SUPABASE_SERVICE_ROLE_KEY')) {
                console.error('::error file=' + file + '::SUPABASE_SERVICE_ROLE_KEY in bundle');
                leaks++;
              }
              const tokens = content.match(jwtRegex) || [];
              for (const token of tokens) {
                const parts = token.split('.');
                try {
                  const payload = JSON.parse(Buffer.from(parts[1], 'base64').toString('utf8'));
                  if (payload.role === 'service_role') {
                    console.error('::error file=' + file + '::service_role JWT in bundle');
                    leaks++;
                  }
                } catch {}
              }
            }
            if (leaks > 0) process.exit(1);
            console.log('✓ Geen service_role leaks');
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
