name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck + Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test
        env:
          # CI heeft de echte productie-keys niet nodig — de unit-tests raken
          # Supabase niet aan. Lege placeholders zorgen dat src/lib/supabase.ts
          # tijdens import niet faalt op de env-check.
          VITE_SUPABASE_URL: 'https://example.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'placeholder-anon-key-for-tests-only'
          VITE_ADMIN_EMAIL: 'admin@example.com'
          VITE_ADMIN_SSO_ENABLED: 'false'

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_ADMIN_SSO_ENABLED: 'false'

      - name: Verify no debug-panel in production bundle
        # Audit-finding L2: dev/debug-panel.ts is achter `import.meta.env.DEV`
        # en hoort tree-shaken te worden in productie-build. Als per ongeluk
        # toch in dist/ komt zou het Supabase-URL + auth-status exposeren
        # in browser-console — niet kritiek maar afwijking van design-intent.
        run: |
          if grep -rl "mountDebugPanel\|RLS test" dist/assets/*.js 2>/dev/null; then
            echo "::error::debug-panel code in productie-bundle gevonden"
            exit 1
          fi
          echo "✓ debug-panel niet in productie-bundle"

      - name: Verify no source maps in production bundle
        # Audit-finding C1: source-maps in dist/ leggen TS-bron volledig bloot.
        # vite.config.ts heeft sourcemap env-gated; dit verifieert het.
        run: |
          if ls dist/assets/*.map 2>/dev/null | grep -q .; then
            echo "::error::Source-maps in productie-bundle gevonden"
            ls dist/assets/*.map
            exit 1
          fi
          echo "✓ Geen source-maps in productie-bundle"

      - name: Verify CSP excludes unsafe-inline in style-src
        # Audit-finding H1: dev-CSP heeft 'unsafe-inline' voor HMR. Vite plugin
        # (vite.config.ts:strictCspPlugin) hoort die te strippen in productie.
        # Faal de build als CSP nog 'unsafe-inline' in style-src bevat —
        # alleen style-src-attr 'unsafe-inline' is toegestaan (voor JS-API).
        run: |
          node -e "
            const html = require('fs').readFileSync('dist/index.html', 'utf8');
            const match = html.match(/Content-Security-Policy\"\s+content=\"([^\"]+)\"/);
            if (!match) {
              console.error('::error::CSP-meta tag niet gevonden in dist/index.html');
              process.exit(1);
            }
            const csp = match[1];
            // Splits in directives
            const directives = csp.split(';').map(d => d.trim()).filter(Boolean);
            for (const d of directives) {
              const [name, ...values] = d.split(/\s+/);
              // style-src en style-src-elem mogen GEEN 'unsafe-inline' hebben.
              // style-src-attr mag het wel (nodig voor el.style.X = value).
              if ((name === 'style-src' || name === 'style-src-elem') && values.includes(\"'unsafe-inline'\")) {
                console.error('::error::CSP directive ' + name + ' bevat unsafe-inline (productie verboden): ' + d);
                process.exit(1);
              }
            }
            console.log('✓ Productie-CSP: style-src + style-src-elem zonder unsafe-inline');
          "

      - name: Verify no service_role JWT in bundle
        # Decodeert elk JWT-achtig token in dist/ en faalt als role=service_role.
        # Gebruikt Node ipv ruwe grep om false-positives op de string "service_role"
        # in comments/labels/error-messages te vermijden.
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const files = [];
            (function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(p);
                else if (/\.(js|css|html)$/.test(entry.name)) files.push(p);
              }
            })('dist');

            const jwtRegex = /eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}/g;
            let leaks = 0;

            for (const file of files) {
              const content = fs.readFileSync(file, 'utf8');

              if (content.includes('SUPABASE_SERVICE_ROLE_KEY')) {
                console.error('::error file=' + file + '::SUPABASE_SERVICE_ROLE_KEY env-var name in bundle');
                leaks++;
              }

              const tokens = content.match(jwtRegex) || [];
              for (const token of tokens) {
                const parts = token.split('.');
                try {
                  const payload = JSON.parse(Buffer.from(parts[1], 'base64').toString('utf8'));
                  if (payload.role === 'service_role') {
                    console.error('::error file=' + file + '::service_role JWT in bundle (iss=' + payload.iss + ')');
                    leaks++;
                  }
                } catch { /* niet-decoderbaar; geen JWT */ }
              }
            }

            if (leaks > 0) {
              console.error('Total leaks: ' + leaks);
              process.exit(1);
            }
            console.log('✓ Geen service_role JWT of env-var-naam in bundle');
          "

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
